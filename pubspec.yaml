name: recipe
description: "A new Flutter project."

# Prevents accidental publishing to pub.dev
publish_to: 'none'

# Versioning
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.3.0
  provider: ^6.1.2
  shared_preferences: ^2.5.2
  flutter_animate: ^4.5.2
  share_plus: ^10.1.4
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.5
  flutter_launcher_icons: ^0.14.3
  audioplayers: ^6.4.0
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3  # Updated to match dependencies
  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/recipe.webp"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/recipe.webp"

flutter:
  uses-material-design: true
  assets:
    - assets/audio/like_sound.mp3
    - assets/recipe.webp
